<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>宾客回复 · 婚礼管理</title><link rel="stylesheet" href="/admin.css"><script defer src="/vendor/supabase-2.118.0.js"></script><script defer src="/rsvp-config.js"></script><script defer src="/admin.js"></script></head><body>
<header><div><span class="eyebrow">WEDDING · GUEST BOOK</span><h1>宾客回复管理</h1></div><a href="/">查看请柬 ↗</a></header>
<main><section id="login-panel" class="card login"><h2>管理员登录</h2><p id="setup-notice">管理员账号待设置。宾客可正常提交，资料会安全保存；添加管理员后即可查看。</p><form id="login-form"><label>邮箱<input type="email" name="email" autocomplete="username" required></label><label>密码<input type="password" name="password" autocomplete="current-password" required></label><button id="login-button">登录后台</button></form><p id="login-status" role="status"></p></section>
<section id="dashboard" hidden><div class="toolbar"><div><span id="connection" role="status">正在连接…</span><p id="last-sync"></p></div><div><button id="refresh" class="secondary">刷新</button><button id="export" class="secondary">导出当前筛选 CSV</button><button id="logout" class="secondary">退出</button></div></div><div class="stats" id="stats"></div><section class="card"><div class="filters"><label>搜索姓名或联系方式<input id="search" type="search" placeholder="搜索宾客"></label><label>出席情况<select id="attendance"><option value="all">全部回复</option><option value="yes">出席</option><option value="no">不出席</option></select></label><label>跟进状态<select id="follow-filter"><option value="all">全部状态</option><option value="new">待跟进</option><option value="contacted">已联系</option><option value="confirmed">已确认</option></select></label></div><p id="result-count" aria-live="polite"></p><p id="load-error" role="alert"></p><div class="table-wrap"><table><thead><tr><th>宾客</th><th>出席 / 人数</th><th>留言</th><th>跟进</th><th>提交时间</th><th>操作</th></tr></thead><tbody id="rows"></tbody></table></div><p id="empty" hidden>暂无符合条件的回复。</p></section></section>
<dialog id="detail"><form id="detail-form"><div class="dialog-head"><h2>回复详情</h2><button type="button" id="close-detail" class="secondary" aria-label="关闭详情">关闭</button></div><dl id="guest-detail"></dl><label>跟进状态<select name="follow_up"><option value="new">待跟进</option><option value="contacted">已联系</option><option value="confirmed">已确认</option></select></label><label>内部备注<textarea name="notes" rows="4" maxlength="2000" placeholder="例如：已电话确认、安排同桌等"></textarea></label><p class="muted">备注只供管理员查看。若其他管理员同时修改，请刷新后再编辑。</p><button id="save-detail">保存跟进</button><p id="detail-status" role="status"></p></form></dialog></main></body></html>
